<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>डिजिटल बिल बुक</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 12px; background: #eef2f6; color: #1f2937; }
    .container { max-width: 820px; margin: auto; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }

    .shop-header {
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .shop-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .shop-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 20px; }
    .shop-header input {
      width: 100%;
      background: rgba(255,255,255,0.95);
      color: #111827;
      border: none;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .shop-header input.shop-name-inp { font-size: 18px; font-weight: bold; }
    .shop-sub-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .shop-sub-row input { flex: 1; min-width: 160px; margin-bottom: 0; }

    .section-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .section-title { font-size: 13px; font-weight: bold; color: #374151; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .row:last-child { margin-bottom: 0; }
    input, select {
      flex: 1;
      min-width: 120px;
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }

    .btn-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button {
      padding: 10px 13px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
    }
    button.btn-add { background: #16a34a; }
    button.btn-pdf { background: #374151; }
    button.btn-wa { background: #15803d; }
    button.btn-sms { background: #0284c7; }
    button.btn-save { background: #1d4ed8; }
    button.btn-old { background: #4f46e5; }
    button.btn-due { background: #d97706; }
    button.btn-calc { background: #7c3aed; }
    button.btn-new { background: #dc2626; }

    .table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
    th { background: #f1f5f9; color: #1e293b; }
    .num { text-align: right; }

    .calc-summary {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .field-group label { display: block; font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 4px; }
    .field-group input, .field-group select { width: 100%; }
    .totals-display { border-top: 1px dashed #cbd5e1; padding-top: 10px; }
    .t-line { display: flex; justify-content: space-between; font-size: 15px; margin: 5px 0; }
    .t-line.grand { font-size: 17px; font-weight: bold; color: #111827; }
    .t-line.due { font-size: 17px; font-weight: bold; color: #b91c1c; }

    .calc-panel {
      display: none;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      border: 1px solid #cbd5e1;
    }
    .calc-layout { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
    .calc-box { width: 280px; max-width: 100%; }
    .calc-screen { width: 100%; text-align: right; font-size: 20px; padding: 8px; margin-bottom: 8px; background: #fff; border: 1px solid #94a3b8; border-radius: 6px; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .calc-grid button { background: #fff; color: #111827; border: 1px solid #cbd5e1; padding: 10px; font-size: 16px; }
    .calc-grid button.op { background: #dbeafe; }
    .calc-grid button.eq { background: #16a34a; color: #fff; border: none; }
    .calc-grid button.clr { background: #dc2626; color: #fff; border: none; }

    .time-box {
      flex: 1;
      min-width: 260px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
    }
    .time-box h4 { margin: 0 0 8px 0; font-size: 14px; color: #1e3a8a; }
    .time-sub { font-size: 12px; font-weight: bold; color: #475569; margin: 8px 0 4px 0; }
    .time-result {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 8px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #1e3a8a;
    }
    .time-money {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 8px;
      margin-top: 6px;
      font-size: 15px;
      font-weight: bold;
      color: #15803d;
    }

    .records-panel {
      display: none;
      margin-top: 16px;
      border-top: 2px solid #e2e8f0;
      padding-top: 12px;
    }
    .record-card {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
    }
    .record-top { display: flex; justify-content: space-between; font-weight: bold; gap: 8px; flex-wrap: wrap; }
    .due-tag { color: #b91c1c; font-weight: bold; }
    .paid-tag { color: #15803d; font-weight: bold; }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff; margin: 0; }
      .container { box-shadow: none; padding: 0; max-width: 100%; }
      .shop-header { background: #fff !important; color: #000 !important; border: 2px solid #000; }
      .shop-header input { background: transparent; color: #000; padding: 2px 0; }
      .section-card, .calc-summary { background: #fff; border: 1px solid #000; }
      input, select { border: none; background: transparent; padding: 2px 0; font-weight: 600; appearance: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shop-header">
      <div class="shop-header-top">
        <strong style="font-size: 16px;">दुकान / कंपनी विवरण</strong>
        <span class="shop-badge" id="docBadge">बिल</span>
      </div>
      <input type="text" id="shopName" class="shop-name-inp" placeholder="दुकान या कंपनी का नाम लिखें" />
      <div class="shop-sub-row">
        <input type="tel" id="shopPhone" placeholder="दुकान का मोबाइल नंबर" />
        <input type="text" id="shopAddress" placeholder="दुकान / कंपनी का पता" />
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">ग्राहक विवरण</div>
      <div class="row">
        <select id="docType">
          <option value="बिल">बिल (Bill)</option>
          <option value="कोटेशन">कोटेशन (Quotation)</option>
        </select>
        <input type="date" id="billDate" />
      </div>
      <div class="row">
        <input type="text" id="custName" placeholder="ग्राहक का नाम" />
        <input type="tel" id="custPhone" placeholder="ग्राहक का मोबाइल नंबर" />
      </div>
      <div class="row">
        <input type="text" id="custAddress" placeholder="ग्राहक का पता" />
      </div>
    </div>

    <div class="section-card no-print">
      <div class="section-title">नया आइटम / काम जोड़ें</div>
      <div class="row">
        <input type="text" id="itemName" placeholder="आइटम या काम का नाम (जैसे ट्रैक्टर जुताई)" style="flex: 2;" />
        <input type="number" id="itemQty" placeholder="मात्रा" min="0" step="any" />
        <select id="itemUnit">
          <option value="घंटा">घंटा</option>
          <option value="मिनट">मिनट</option>
          <option value="नग">नग</option>
          <option value="Kg">Kg</option>
          <option value="ग्राम">ग्राम</option>
          <option value="एकड़">एकड़</option>
          <option value="बीघा">बीघा</option>
          <option value="लीटर">लीटर</option>
          <option value="मीटर">मीटर</option>
          <option value="फीट">फीट</option>
          <option value="पैकेट">पैकेट</option>
          <option value="बोरी">बोरी</option>
          <option value="दिन">दिन</option>
        </select>
      </div>
      <div class="row">
        <input type="number" id="itemRate" placeholder="दर (रुपए ₹)" min="0" step="any" />
        <button type="button" class="btn-add" id="btnAddItem">+ नई लाइन जोड़ें</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>क्र.</th>
            <th>आइटम</th>
            <th>मात्रा व यूनिट</th>
            <th class="num">दर (₹)</th>
            <th class="num">योग (₹)</th>
            <th class="no-print">हटाएं</th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <div class="calc-summary">
      <div class="sum-grid">
        <div class="field-group">
          <label>उपयोग / जमा राशि (₹)</label>
          <input type="number" id="paidAmount" placeholder="0" min="0" step="any" />
        </div>
        <div class="field-group">
          <label>पेमेंट मोड</label>
          <select id="paymentMode">
            <option value="नकद (Cash)">नकद (Cash)</option>
            <option value="UPI / ऑनलाइन">UPI / ऑनलाइन</option>
            <option value="बैंक ट्रांसफर">बैंक ट्रांसफर</option>
            <option value="उधार (Credit)">उधार (Credit)</option>
          </select>
        </div>
      </div>

      <div class="totals-display">
        <div class="t-line grand">
          <span>कुल योग (Total):</span>
          <span>₹ <span id="totalAmount">0</span></span>
        </div>
        <div class="t-line">
          <span>उपयोग / जमा (Paid):</span>
          <span>₹ <span id="paidDisplay">0</span></span>
        </div>
        <div class="t-line due">
          <span>बाकी राशि (Balance):</span>
          <span>₹ <span id="dueAmount">0</span></span>
        </div>
      </div>
    </div>

    <div class="btn-bar no-print">
      <button type="button" class="btn-pdf" id="btnPdf">PDF / प्रिंट</button>
      <button type="button" class="btn-wa" id="btnWa">वॉट्सएप</button>
      <button type="button" class="btn-sms" id="btnSms">मैसेज (SMS)</button>
      <button type="button" class="btn-save" id="btnSave">सेव</button>
      <button type="button" class="btn-old" id="btnOld">पुराने बिल</button>
      <button type="button" class="btn-due" id="btnDue">बाकी बिल</button>
      <button type="button" class="btn-calc" id="btnCalc">कैलकुलेटर</button>
      <button type="button
